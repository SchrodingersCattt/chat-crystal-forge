name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MATTERVIS_PREWARM: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install recorded source checkouts
        run: python -m pip install -e external/molcryskit -e "external/mattervis[all,test]" -e ".[dev]"
      - name: Lint Forge
        run: python -m ruff check src tests
      - name: Test Forge including native hosts
        run: python -B -m pytest tests -q
      - name: Full MatterVis regression gate
        working-directory: external/mattervis
        run: python -B -m pytest tests -n 4 --dist loadfile -q